services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rhel-vuln:latest
    container_name: rhel-vuln
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
